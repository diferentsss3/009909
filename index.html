<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Quest: C++ и Arduino</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#1b1d2a;--mut:#6b7085;--ac:#5b5ef4;--ok:#17a34a;--bad:#e11d48;--code:#12141f;--codetx:#c9f2c7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13141c;--card:#1e2030;--tx:#eceefb;--mut:#9a9fb8;--ac:#7c7ff7}}
:root[data-theme="dark"]{--bg:#13141c;--card:#1e2030;--tx:#eceefb;--mut:#9a9fb8;--ac:#7c7ff7}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 2px}.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.stats{display:flex;gap:8px;margin-bottom:14px}.stats div{flex:1;background:var(--card);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:var(--mut)}
button{font:inherit;border:0;cursor:pointer;color:var(--tx)}
.mode{display:block;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.mode b{display:block;font-size:17px}.mode small{color:var(--mut)}
.bar{height:8px;background:rgba(127,127,127,.25);border-radius:6px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600}
pre{background:var(--code);color:var(--codetx);border-radius:12px;padding:12px;margin:10px 0;overflow-x:auto;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.q{font-size:18px;font-weight:600;margin:6px 0}
.opt{display:block;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:13px;margin-bottom:8px;border:2px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.opt.ok{border-color:var(--ok);background:rgba(23,163,74,.15)}.opt.bad{border-color:var(--bad);background:rgba(225,29,72,.14)}
.why{border-left:4px solid var(--ac);padding:10px 12px;margin:10px 0;background:var(--card);border-radius:0 12px 12px 0}
.main{display:block;width:100%;background:var(--ac);color:#fff;border-radius:14px;padding:14px;font-weight:700;margin-top:6px}
.ghost{display:block;width:100%;background:none;color:var(--mut);padding:12px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:8px;background:var(--ac);color:#fff}
.pop{animation:p .3s}@keyframes p{50%{transform:scale(1.05)}}
.big{font-size:56px;text-align:center}
</style></head><body><div id="app"></div>

const MODES=[["k","📇 Карточки: значения строк","Строка → что она делает. Учи, пока не станет «знаю»"],["c","🧠 C++","Разбор программ по темам 1–9"],["a","🔌 Arduino","Темы 8–18: пины, датчики, ШИМ"],["b","🐞 Найди ошибку","Баги из ваших программ, их спросят на защите"],["all","🎲 Всё вперемешку","Случайные вопросы"]];
let S={xp:0,best:0,wrong:[],done:0,kn:[]};
try{const s=localStorage.getItem("cq");if(s)S=Object.assign(S,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem("cq",JSON.stringify(S))}catch(e){}};
const app=document.getElementById("app");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const lvl=()=>Math.floor(S.xp/100)+1;
let R=null;
function el(h){const d=document.createElement("div");d.innerHTML=h;return d}
function home(){
 app.innerHTML="";
 app.append(el(`<h1>Code Quest</h1><p class="sub">Учи шпаргалку играя: 3 жизни, 10 вопросов</p>
 <div class="stats"><div><b>${lvl()}</b><span>уровень</span></div><div><b>${S.xp}</b><span>XP</span></div><div><b>${S.best}</b><span>рекорд серии</span></div></div>
 <div class="bar"><i style="width:${S.xp%100}%"></i></div>`));
 MODES.forEach(m=>{const b=document.createElement("button");b.className="mode";b.innerHTML=`<b>${m[1]}</b><small>${m[2]}</small>`;b.onclick=()=>m[0]==="k"?deck():start(m[0]);app.append(b)});
 if(S.wrong.length){const b=document.createElement("button");b.className="mode";b.innerHTML=`<b>🔁 Работа над ошибками (${S.wrong.length})</b><small>Вопросы, где ты ошибся</small>`;b.onclick=()=>start("w");app.append(b)}
}
function start(m){
 let ids=Q.map((_,i)=>i);
 if(m==="w")ids=S.wrong.filter(i=>Q[i]);
 else if(m!=="all")ids=ids.filter(i=>Q[i][0].split(",").includes(m));
 R={ids:sh(ids).slice(0,10),i:0,lives:3,ok:0,streak:0,xp:0};
 if(!R.ids.length)return home();
 ask();
}
function ask(){
 const q=Q[R.ids[R.i]];
 const opts=sh([0,1,2,3].map(k=>({t:q[3+k],c:k===0})));
 app.innerHTML="";
 app.append(el(`<div class="top"><span>${"❤️".repeat(R.lives)+"🖤".repeat(3-R.lives)}</span><span>🔥 ${R.streak}</span><span>${R.i+1}/${R.ids.length}</span></div><div class="bar"><i style="width:${R.i/R.ids.length*100}%"></i></div>`));
 if(q[0].includes("b"))app.append(el(`<span class="tag">🐞 найди ошибку</span>`));
 const pre=document.createElement("pre");pre.textContent=q[1];
 if(!/^[^\n]*\?$/.test(q[1]) || q[1].includes(";") || q[1].includes("{"))app.append(pre);
 const qq=document.createElement("div");qq.className="q";qq.textContent=/^[^\n]*\?$/.test(q[1])&&!q[1].includes(";")?q[1]:q[2];app.append(qq);
 let locked=false;const btns=[];
 opts.forEach(o=>{const b=document.createElement("button");b.className="opt";b.textContent=o.t;btns.push([b,o]);
  b.onclick=()=>{if(locked)return;locked=true;
   btns.forEach(([bb,oo])=>{if(oo.c)bb.classList.add("ok")});
   const id=R.ids[R.i];
   if(o.c){R.ok++;R.streak++;const g=10+Math.min(R.streak,5)*2;R.xp+=g;S.best=Math.max(S.best,R.streak);S.wrong=S.wrong.filter(x=>x!==id);b.classList.add("pop")}
   else{b.classList.add("bad");R.lives--;R.streak=0;if(!S.wrong.includes(id))S.wrong.push(id)}
   S.xp+=o.c?10+Math.min(R.streak,5)*2:0;save();
   app.append(el(`<div class="why">${o.c?"✅ Верно! ":"❌ Не то. "}</div>`));
   app.lastChild.append(document.createTextNode(q[7]));
   const n=document.createElement("button");n.className="main";n.textContent=(R.lives<=0||R.i+1>=R.ids.length)?"Результат":"Дальше";
   n.onclick=()=>{R.i++;(R.lives<=0||R.i>=R.ids.length)?end():ask()};app.append(n);n.scrollIntoView({block:"nearest"});
  };app.append(b)});
}
function end(){
 const win=R.lives>0,st=R.ok>=R.ids.length?3:R.ok>=R.ids.length*.7?2:R.ok>=R.ids.length*.4?1:0;
 S.done++;save();app.innerHTML="";
 app.append(el(`<div class="big">${win?"🏆":"💀"}</div><h1 style="text-align:center">${win?"Раунд пройден!":"Жизни закончились"}</h1>
 <p class="sub" style="text-align:center">${"⭐".repeat(st)+"☆".repeat(3-st)}<br>Верно: ${R.ok} из ${R.ids.length} · +${R.xp} XP · уровень ${lvl()}</p>`));
 const a=document.createElement("button");a.className="main";a.textContent="Ещё раунд";a.onclick=home;app.append(a);
 if(S.wrong.length){const b=document.createElement("button");b.className="ghost";b.textContent=`Повторить ошибки (${S.wrong.length})`;b.onclick=()=>start("w");app.append(b)}
}

function deck(){
 app.innerHTML="";
 app.append(el(`<h1>📇 Карточки</h1><p class="sub">Прочитай строку, вспомни значение, переверни. «Знаю» убирает карточку, «Ещё раз» возвращает её через пару карт.</p>`));
 [["c","C++"],["a","Arduino"],["all","Всё вместе"]].forEach(([k,n])=>{
  const p=C.filter(x=>k==="all"||x[0]===k),kn=p.filter(x=>S.kn.includes(x[1])).length;
  const b=document.createElement("button");b.className="mode";b.innerHTML=`<b>${n}</b><small>выучено ${kn} из ${p.length}</small>`;b.onclick=()=>cards(k);app.append(b)});
 const r=document.createElement("button");r.className="ghost";r.textContent="Сбросить прогресс карточек";r.onclick=()=>{S.kn=[];save();deck()};app.append(r);
 const h=document.createElement("button");h.className="ghost";h.textContent="← В меню";h.onclick=home;app.append(h);
}
function cards(k){
 const pool=C.filter(x=>k==="all"||x[0]===k);
 let q=sh(pool.filter(x=>!S.kn.includes(x[1])));
 if(!q.length){S.kn=S.kn.filter(l=>!pool.some(x=>x[1]===l));q=sh(pool)}
 const total=pool.length;
 function show(){
  app.innerHTML="";
  const kn=total-q.length;
  const top=el(`<div class="top"><span>📇 выучено ${kn} из ${total}</span><span>осталось ${q.length}</span></div><div class="bar"><i style="width:${kn/total*100}%"></i></div>`);app.append(top);
  if(!q.length){app.append(el(`<div class="big">🎉</div><h1 style="text-align:center">Все карточки выучены!</h1>`));
   S.xp+=total;save();
   const b=document.createElement("button");b.className="main";b.textContent="К колодам";b.onclick=deck;app.append(b);return}
  const c=q[0];
  const pre=document.createElement("pre");pre.textContent=c[1];app.append(pre);
  app.append(el(`<div class="q">Что делает эта строка?</div>`));
  const rv=document.createElement("button");rv.className="main";rv.textContent="Показать значение";
  rv.onclick=()=>{rv.remove();
   const w=document.createElement("div");w.className="why";w.textContent=c[2];app.append(w);
   const y=document.createElement("button");y.className="main";y.textContent="✅ Знаю";
   y.onclick=()=>{q.shift();if(!S.kn.includes(c[1]))S.kn.push(c[1]);save();show()};
   const n=document.createElement("button");n.className="ghost";n.textContent="🔁 Ещё раз";
   n.onclick=()=>{q.shift();q.splice(Math.min(3,q.length),0,c);show()};
   app.append(y,n)};
  app.append(rv);
  const h=document.createElement("button");h.className="ghost";h.textContent="← К колодам";h.onclick=deck;app.append(h);
 }
 show();
}
home();
